[versions]
java-compile = "21"
java-support = "8"
kotlin = "2.4.10"
dokka = "2.1.0"
ktlint = "1.8.0"

[plugins]
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
dokka-javadoc = { id = "org.jetbrains.dokka-javadoc", version.ref = "dokka" }
ktlint-gradle = "org.jlleitschuh.gradle.ktlint:14.2.0"
gradle-publish = "com.gradle.plugin-publish:2.1.0"
git-publish = "org.ajoberstar.git-publish:5.1.3"

[libraries]
# lint
rulebook-ktlint = "com.hanggrian.rulebook:rulebook-ktlint:0.2"
# main
kotlinx-html-jvm = "org.jetbrains.kotlinx:kotlinx-html-jvm:0.12.0"
commonmark-ext-gfm-tables = "org.commonmark:commonmark-ext-gfm-tables:0.27.1"
# test
junit = "junit:junit:4.13.2"
truth = "com.google.truth:truth:1.4.5"

[bundles]
junit4 = [
  "junit",
  "truth",
]
